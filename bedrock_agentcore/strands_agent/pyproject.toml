[project]
name = "temporalio-samples-bedrock-agentcore-strands"
version = "0.1a1"
description = "Temporal.io Python SDK Strands agent on Amazon Bedrock AgentCore sample"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "temporalio[strands-agents,pydantic]>=1.32.0,<2",
    "strands-agents>=1.39.0",
    "bedrock-agentcore>=1.9.1",
    "strands-agents-tools>=0.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0,<0.6",
    "mypy>=1.4.1,<2",
    "poethepoet>=0.36.0",
    "pytest>=7.1.2,<8",
    "pytest-asyncio>=0.18.3,<0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.poe.tasks]
format = [
    { cmd = "uv run ruff check --select I --fix" },
    { cmd = "uv run ruff format" },
]
lint = [
    { cmd = "uv run ruff check --select I" },
    { cmd = "uv run ruff format --check" },
    { ref = "lint-types" },
]
lint-types = "uv run --all-groups mypy --check-untyped-defs --namespace-packages ."
test = "uv run pytest"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
# `agentcore deploy` generates a CDK scaffold here and stages the whole
# dependency tree under .cache/ when it builds; neither is ours to lint.
extend-exclude = ["agentcore"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["agentcore/"]
