[project]
name = "temporalio-samples-bedrock-agentcore-openai"
version = "0.1a1"
description = "Temporal.io Python SDK OpenAI Agents SDK agent on Amazon Bedrock AgentCore sample"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    # TEMPORARY: both resolve to local wheels (see [tool.uv.sources]) until
    # activity sessions are released; then restore the PyPI floors.
    "temporalio>=1.34.0,<2",
    "temporalio-openai-agents",
    "openai-agents>=0.22,<0.23",
    "bedrock-agentcore>=1.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0,<0.6",
    "mypy>=1.4.1,<2",
    "poethepoet>=0.36.0",
    "pytest>=7.1.2,<8",
    "pytest-asyncio>=0.18.3,<0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# TEMPORARY: unreleased builds of temporalio (activity sessions) and
# temporalio-openai-agents (session_options), produced by
# ../build-local-wheels.sh. Path sources mean uv never looks these packages up on
# PyPI -- including the `uv pip install -r pyproject.toml --python-platform
# aarch64-manylinux...` that `agentcore deploy` runs for the CodeZip build.
# Remove this table once the releases exist.
[tool.uv.sources]
temporalio = [
    { path = "../wheels/temporalio-1.34.0+sessions-cp310-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl", marker = "sys_platform == 'linux'" },
    { path = "../wheels/temporalio-1.34.0+sessions-cp310-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]
temporalio-openai-agents = { path = "../wheels/temporalio_openai_agents-0.0.0-py3-none-any.whl" }

[tool.uv]
# The local temporalio wheels only cover macOS and Linux; lock nothing else.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.poe.tasks]
format = [
    { cmd = "uv run ruff check --select I --fix" },
    { cmd = "uv run ruff format" },
]
lint = [
    { cmd = "uv run ruff check --select I" },
    { cmd = "uv run ruff format --check" },
    { ref = "lint-types" },
]
lint-types = "uv run --all-groups mypy --check-untyped-defs --namespace-packages ."
test = "uv run pytest"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
# `agentcore deploy` generates a CDK scaffold here and stages the whole
# dependency tree under .cache/ when it builds; neither is ours to lint.
extend-exclude = ["agentcore"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["agentcore/"]
