[project]
name = "temporalio-samples-gcp-cloud-run"
version = "0.1a1"
description = "Temporal Worker on a Google Cloud Run worker pool with the Cloud Run Id and OpenTelemetry plugins"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["temporalio[cloud-run-worker-otel]==1.37.1"]

[dependency-groups]
dev = [
    "ruff>=0.5.0,<0.6",
    "mypy>=1.4.1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
# Validate against the unreleased sdk-python release branch chore/release-1.37.1.
temporalio = { git = "https://github.com/temporalio/sdk-python.git", branch = "chore/release-1.37.1" }
