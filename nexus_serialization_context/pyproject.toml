[project]
name = "temporalio-samples-nexus-serialization-context"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["temporalio==1.37.1", "cryptography>=41.0.5"]

[dependency-groups]
dev = [
    "ruff>=0.5.0,<0.6",
    "mypy>=1.4.1,<2",
    "poethepoet>=0.36.0",
    "pytest>=7.1.2,<8",
    "pytest-asyncio>=0.18.3,<0.19",
]

[tool.poe.tasks]
format = [
    { cmd = "uv run ruff check --select I --fix" },
    { cmd = "uv run ruff format" },
]
lint = [
    { cmd = "uv run ruff check --select I" },
    { cmd = "uv run ruff format --check" },
    { cmd = "uv run mypy --check-untyped-defs --explicit-package-bases ." },
]
test = "uv run pytest"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true

[tool.uv.sources]
# Validate against the unreleased sdk-python release branch chore/release-1.37.1.
temporalio = { git = "https://github.com/temporalio/sdk-python.git", branch = "chore/release-1.37.1" }
